[project]
name = "pepe-backend"
version = "1.0.0"
description = "Booking-Backend der Artistenagentur Pepe Shows (Flask)"
# Untergrenze bewusst durchlaessig, damit eine vorhandene 3.11-venv lokal
# weiterlaeuft. Fuer das Deployment gilt `.python-version` (3.12): Vercels
# `vercel-runtime` verlangt 3.12, mit dem alten Pin auf 3.11.11 brach der Build
# mit "No solution found when resolving dependencies" ab.
requires-python = ">=3.11"

# Abhaengigkeiten stehen weiterhin in requirements.txt (Vercel und Render lesen
# beide diese Datei). Hier bewusst nicht doppelt gepflegt.

[tool.vercel]
# `app.py` definiert die Flask-Instanz `app`, dieselbe, die auch
# `flask db upgrade` ueber FLASK_APP benutzt (siehe .flaskenv).
#
# Derselbe Wert steht in der Root-`vercel.json` beim Service `backend`. Das ist
# Absicht: In der Services-Aufstellung gilt die Root-Datei, diese Angabe hier
# greift, falls das Backend einmal als eigenes Vercel-Projekt laeuft.
entrypoint = "app:app"
