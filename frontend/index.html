<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- seo:start -->
    <!-- Wird beim Build je Seite ersetzt (scripts/prerender-seo.mjs) und beim App-Start entfernt,
         danach setzt die SEO-Komponente die Tags. So gibt es nie doppelte Canonicals. -->
    <title data-prerender>Pepe Shows - Artistenagentur &amp; Show-Booking aus München</title>
    <meta data-prerender name="description" content="Pepe Shows ist Ihre Artistenagentur aus München. Akrobaten, Feuerkünstler, Jongleure und Zirkusartisten für Events, Messen und Galas buchen." />
    <link data-prerender rel="canonical" href="https://www.pepeshows.de/" />
    <!-- seo:end -->
    <meta name="author" content="Pepe Shows" />
    <meta property="og:site_name" content="Pepe Shows" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Favicon with dark/light theme support -->
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" />
    <link rel="apple-touch-icon" href="/favicon-light.svg" />

    <!-- Preconnect to Google Fonts for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Load Google Fonts with optimized display=swap and only critical weights -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Defer Material Icons - not critical for initial render -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" media="print" onload="this.media='all'" />
